<!doctype html>
<html lang="ko" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (() => {
        try {
          const prefs = JSON.parse(localStorage.getItem("waferguard.ui.preferences.v1") || "{}");
          const theme = prefs.theme === "dark" ? "dark" : "light";
          const language = prefs.language === "en" ? "en" : "ko";
          document.documentElement.dataset.theme = theme;
          document.documentElement.lang = language;
          document.documentElement.style.colorScheme = theme;
        } catch (_) {}
      })();
    </script>
    <title>WaferGuard — Fab Quality Ops</title>
    <meta name="description" content="WaferGuard Fab Quality Ops dashboard" />
    <meta property="og:title" content="WaferGuard — Fab Quality Ops" />
    <meta property="og:description" content="Process time-series, wafer vision, RCA, and MLOps in one operational workflow." />
    <meta property="og:image" content="/waferguard-social.png" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="/waferguard-social.png" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
