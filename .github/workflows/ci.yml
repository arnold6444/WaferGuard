name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: waferguard
          POSTGRES_USER: waferguard
          POSTGRES_PASSWORD: waferguard
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U waferguard -d waferguard"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt

      - name: Unit and regression tests (SQLite)
        env:
          STORAGE_BACKEND: sqlite
        run: python -m pytest -q

      - name: PostgreSQL integration test
        env:
          STORAGE_BACKEND: postgres
          RDS_HOST: 127.0.0.1
          RDS_PORT: '5432'
          RDS_DB: waferguard
          RDS_USER: waferguard
          RDS_PASSWORD: waferguard
          DB_POOL_MIN: '1'
          DB_POOL_MAX: '4'
          RUN_POSTGRES_TESTS: '1'
        run: python -m pytest tests/test_postgres_integration.py -q

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend install
        working-directory: frontend
        run: npm ci

      - name: Frontend production build
        working-directory: frontend
        run: npm run build

      - name: Python compile check
        env:
          STORAGE_BACKEND: sqlite
        run: python -m compileall -q app scripts tests
